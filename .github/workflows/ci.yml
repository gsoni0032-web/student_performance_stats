name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (coverage must stay above 80%)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-to-pass-validation
      CORS_ORIGINS: http://localhost:8080
      E2E_PASSWORD: Ci-Demo-Password-1
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Seed demo data and train the first model
        run: docker compose exec -T backend python -m app.cli seed --students 500 --demo-password "$E2E_PASSWORD"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
