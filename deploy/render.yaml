# Render Blueprint: backend API + managed Postgres.
# In Render choose New > Blueprint and point it at this repository (render.yaml must be at the
# repository root for auto-detection, so copy it there or use "Blueprint file path: deploy/render.yaml").
# The frontend is deployed separately to Vercel or Netlify (see README).
databases:
  - name: pathway-db
    plan: free
    databaseName: pathway
    user: pathway

services:
  - type: web
    name: pathway-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pathway-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to your frontend URL, e.g. https://pathway.vercel.app
      - key: FORCE_HTTPS
        value: "true"
      - key: MODEL_DIR
        value: /data/models
    disk:
      name: model-store
      mountPath: /data/models
      sizeGB: 1
